name: Application runs on a self hosted runner

on:
  push: 
    branches:
      - main
  
    path: 
      - 'ssh-ci.yml'

  workflow_dispatch:

jobs:
  ssh-login:
    runs-on: ubuntu-latest

    steps: 
      - name: Connect to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.AZURE_VM_HOST}}
          username: ${{secrets.AZURE_VM_USER}}
          key: ${{secrets.AZURE_VM_SSH_PRIVATE_KEY}}
          script: |
            echo "SSH Connection Succesful!"
            whoami
            hostname
            docker images  

# run is used to execute the commands on the github runner and script is used to execute the commands on azure/self-hosted vm