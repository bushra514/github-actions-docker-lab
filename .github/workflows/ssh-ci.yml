name: Application runs on a self hosted runner

on:
  push: 
    branches:
      - main
  
    path: 
      - 'ssh-ci.yml'

  workflow_dispatch:

jobs:
  ssh-login:
    runs-on: ubuntu-latest

    steps: 
      - name: Connect to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.AZURE_VM_HOST}}
          username: ${{secrets.AZURE_VM_USER}}
          key: ${{secrets.AZURE_VM_SSH_PRIVATE_KEY}}
          script: |
            echo "SSH Connection Succesful!"
            whoami
            pwd
            hostname
            docker images  

# run is used to execute the commands on the github runner and script is used to execute the commands on azure vm

  docker-image-pull:
    runs-on: self-hosted

    steps:
      - name: Check docker images
        run: docker images
      
      - name: Pull image from dockerhub
        run: docker pull bushrahassan/myapp:58302cb413a94b4f5f2d86d566e9e0cad0fb838f

      - name: Check pulled image
        run: docker images

      