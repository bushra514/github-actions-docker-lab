name: Github actions with docker

on:
  push:
    branches:
      - main

    path:
      - '**.yml'
      - '!requirements.txt'

  workflow_dispatch:


jobs:
  docker-info:  


    runs-on: ubuntu-latest

    steps:
      - name: Check docker version
        run: docker --version
      
      - name: display docker info
        run: docker info
      
      - name: Display docker images 
        run: docker images

      - name: docker containers
        run: docker ps -a

  docker-image-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/Checkout@v4

      - name: Build the docker image
        run: docker build -t myapp:v1.0.0 .

      - name: List newly created docker image
        run: docker images

      - name: Build a container from image
        run: docker run -dt --name myapp-container myapp:v1.0.0

      - name: Display running docker containers
        run: docker ps -a
