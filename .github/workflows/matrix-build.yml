#"We define a single job configuration using a matrix strategy. 
# GitHub Actions dynamically expands that job into multiple executions based on the combinations defined in the matrix. 
# This avoids duplicating workflow code and allows us to test across multiple environments."

name: Matrix build 

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  test:
    strategy:
      max-parallel: 3 
      matrix:
        os: [ubuntu, windows]
        python-version: ["3.11","3.12","3.13"]
        exclude:
          - os: windows-latest
            python: "3.11"

        include:
          - python-version: ["310"]
            experimental : true

        # include:
        #   - os: ubuntu-latest
        #     python-version: "3.11"

        #   - os: ubuntu-latest
        #     python-version: "3.12"

        #   - os: windows-latest
        #     python-version: "3.11"

        #   - os: windows-latest
        #     python-version: "3.12"

    runs-on: ${{matrix.os}}

    steps:
      - name: Setup python
        uses: actions/checkout@v4
        with:
          python-version: ${{matrix.python-version}}

      - name: Display python version
        run: python --version

